name: nkgrabber
description: "NKgrabber 抢课程序 - 高校选课辅助客户端"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.12.2
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  # >=3.4.0 for CookieManager.ignoreInvalidCookies — the campus portal sends a
  # malformed `Set-Cookie: HttpOnly=` that otherwise kills the whole save.
  dio_cookie_manager: ^3.4.0

  # Database
  drift: ^2.22.1
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Crypto
  pointycastle: ^3.9.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  logging: ^1.3.0

  # UI
  cupertino_icons: ^1.0.8
  charset: ^2.0.1
  file_saver: ^0.4.0
  # Background image: pick a local picture.
  file_picker: ^11.0.3
  # Background image: derive the theme seed from the picture. Pinned by the
  # Flutter SDK; `any` defers to that pin rather than fighting it.
  material_color_utilities: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Linting
  very_good_analysis: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  drift_dev: ^2.22.1

  # Testing
  mockito: ^5.4.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
