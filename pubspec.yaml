name: nkgrabber
description: "NKgrabber 抢课程序 - 高校选课辅助客户端"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Database
  drift: ^2.22.1
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Crypto
  pointycastle: ^3.9.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  logging: ^1.3.0

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Linting
  very_good_analysis: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  drift_dev: ^2.22.1

  # Testing
  mockito: ^5.4.5

flutter:
  uses-material-design: true
  generate: true
