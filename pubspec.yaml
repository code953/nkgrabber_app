name: nkgrabber
description: "NKgrabber 抢课程序 - 高校选课辅助客户端"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.4.4

  # Routing
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Secure storage
  flutter_secure_storage: ^9.2.4

  # Crypto
  pointycastle: ^3.9.1
  cryptography: ^2.7.0
  crypto: ^3.0.6

  # Utilities
  uuid: ^4.5.1
  ulid: ^2.0.0
  intl: any
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.19.0
  package_info_plus: ^8.1.3
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  archive: ^4.0.2
  logging: ^1.3.0

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Linting
  very_good_analysis: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.22.1

  # Testing
  mockito: ^5.4.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/keys/
