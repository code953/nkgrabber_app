name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            echo "A release signed with the debug key cannot be upgraded to a"
            echo "properly signed build later — users would have to uninstall."
            echo "Refusing to publish rather than shipping that silently."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --target-platform android-${{ matrix.target }} \
            --split-per-abi
      - name: Verify the APK is not debug-signed
        run: |
          # A successful build proves nothing about which key signed it, and a
          # debug-signed release is the one mistake that cannot be corrected
          # after users install. Assert on the certificate itself.
          APK=$(find build/app/outputs/flutter-apk -name '*.apk' | head -1)
          if keytool -printcert -jarfile "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::$APK is signed with the Android debug key."
            exit 1
          fi
          keytool -printcert -jarfile "$APK" | grep -E 'Owner|Valid'
      - name: Clean up signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.target }}
          path: build/app/outputs/flutter-apk/*.apk

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
      - name: Create zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nkgrabber-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: nkgrabber-windows-x64.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - name: Create tarball
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/nkgrabber-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: nkgrabber-linux-x64.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build macos --release
      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          hdiutil create -volname NKgrabber \
            -srcfolder nkgrabber.app \
            -ov -format UDZO \
            "$GITHUB_WORKSPACE/nkgrabber-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: nkgrabber-macos-universal.dmg

  build-ios:
    name: Build iOS (验证)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Flatten the per-artifact subdirectories. Without this the checksum
          # file records paths like `./windows-x64/nkgrabber-windows-x64.zip`,
          # which never match the flat filenames the release actually serves —
          # so `sha256sum -c` fails on every line for anyone who tries it.
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.apk *.zip *.tar.gz *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # v1.0.0-beta is not a stable release; without this GitHub would
          # label it "Latest" and hand it to everyone browsing the repo.
          prerelease: true
          files: |
            artifacts/*.apk
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/SHA256SUMS.txt
