name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set."
            echo "A release signed with the debug key cannot be upgraded to a"
            echo "properly signed build later — users would have to uninstall."
            echo "Refusing to publish rather than shipping that silently."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
      - name: Build APKs
        # --split-per-abi already emits one APK per ABI (arm64-v8a,
        # armeabi-v7a, x86_64) from a single build, so there is nothing for a
        # matrix to parallelise here. The previous matrix passed its ABI
        # directory name to --target-platform, which only accepts
        # android-arm/android-arm64/android-x64 — every job died with exit 64
        # before compiling anything, and that blocked create-release.
        run: flutter build apk --release --split-per-abi
      - name: Verify the APKs are not debug-signed
        run: |
          # A successful build proves nothing about which key signed it, and a
          # debug-signed release is the one mistake that cannot be corrected
          # after users install. Assert on the certificate itself — for every
          # APK, since each ABI split is signed separately.
          #
          # apksigner, not `keytool -printcert -jarfile`: keytool reads only v1
          # (JAR) signatures, and at minSdk 24 AGP signs with v2 only, so
          # keytool sees nothing at all. That failed loudly here only by
          # accident — the "is it the debug key" test greps output that is
          # always empty, so it would have reported a debug-signed APK as
          # clean. A check that cannot fail is worse than no check.
          # $ANDROID_SDK_ROOT is not guaranteed to be exported in every step,
          # so fall back through the other names the runner image uses before
          # giving up. Failing to *find* the tool must not look like a pass.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $SDK/build-tools."
            exit 1
          fi
          echo "Using $APKSIGNER"
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*-release.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No release APKs were produced."
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "--- $apk"
            # Capture rather than pipe: piping into grep swallows the tool's
            # own error message on stdout, which is what made the previous
            # failure show up as a bare exit 1 with no explanation.
            certs=$("$APKSIGNER" verify --print-certs "$apk")
            echo "$certs"
            if ! grep -q 'certificate DN:' <<<"$certs"; then
              echo "::error::$apk carries no signing certificate."
              exit 1
            fi
            if grep -q 'CN=Android Debug' <<<"$certs"; then
              echo "::error::$apk is signed with the Android debug key."
              exit 1
            fi
          done
      - name: Clean up signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*-release.apk

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
      - name: Create zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nkgrabber-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: nkgrabber-windows-x64.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release
      - name: Create tarball
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/nkgrabber-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: nkgrabber-linux-x64.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build macos --release
      - name: Create DMG
        run: |
          cd build/macos/Build/Products/Release
          hdiutil create -volname NKgrabber \
            -srcfolder nkgrabber.app \
            -ov -format UDZO \
            "$GITHUB_WORKSPACE/nkgrabber-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: nkgrabber-macos-universal.dmg

  build-ios:
    name: Build iOS (验证)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Flatten the per-artifact subdirectories. Without this the checksum
          # file records paths like `./windows-x64/nkgrabber-windows-x64.zip`,
          # which never match the flat filenames the release actually serves —
          # so `sha256sum -c` fails on every line for anyone who tries it.
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.apk *.zip *.tar.gz *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # v1.0.0-beta is not a stable release; without this GitHub would
          # label it "Latest" and hand it to everyone browsing the repo.
          prerelease: true
          files: |
            artifacts/*.apk
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.dmg
            artifacts/SHA256SUMS.txt
